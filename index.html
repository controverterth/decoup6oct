<script>
/* พื้นหลังเคลื่อนไหว: abstract เบลอ ลึกลับ — ดำ ~70% · แดง ~22% · ขาว ~8%
   วาดก้อนสีนุ่ม ๆ บนแคนวาสเล็กแล้วขยายเต็มจอพร้อมเบลอ */
(function(){
  const cv=document.getElementById('bg'); if(!cv) return; const ctx=cv.getContext('2d');
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SW=160; let SH=90, blobs=[], t=0;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function make(color,n,rmin,rmax,alpha){ const out=[]; for(let i=0;i<n;i++) out.push({color,alpha,x:rnd(0,SW),y:rnd(0,SH),r:rnd(rmin,rmax),ax:rnd(6,22),ay:rnd(4,14),px:rnd(0,6.28),py:rnd(0,6.28),sx:rnd(0.05,0.12),sy:rnd(0.04,0.1)}); return out; }
  function resize(){ SH=Math.round(SW*window.innerHeight/window.innerWidth); cv.width=SW; cv.height=SH;
    blobs=[...make('139,35,35',5,SW*0.10,SW*0.22,0.7), ...make('245,245,245',3,SW*0.035,SW*0.08,0.4)]; draw(); }
  function draw(){ ctx.fillStyle='#000'; ctx.fillRect(0,0,SW,SH);
    for(const b of blobs){ const x=b.x+Math.sin(t*b.sx+b.px)*b.ax, y=b.y+Math.cos(t*b.sy+b.py)*b.ay;
      const g=ctx.createRadialGradient(x,y,0,x,y,b.r); g.addColorStop(0,`rgba(${b.color},${b.alpha})`); g.addColorStop(0.55,`rgba(${b.color},${b.alpha*0.45})`); g.addColorStop(1,`rgba(${b.color},0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,b.r,0,6.283); ctx.fill(); }
    // grain
    ctx.fillStyle='rgba(0,0,0,.06)'; for(let i=0;i<40;i++) ctx.fillRect(Math.random()*SW,Math.random()*SH,1,1); }
  function step(){ t+=0.016; draw(); requestAnimationFrame(step); }
  window.addEventListener('resize',resize); resize(); if(!reduce) requestAnimationFrame(step);
})();
</script>

// ดึงข้อมูลสดจาก Google Sheet (File > Share > Publish to web > CSV) — ใช้เมื่อ deploy จริง
window.loadFromGoogleSheet = async function(csvUrl, signal){
  const text = await (await fetch(csvUrl,{cache:'no-store',signal})).text();
  const rows=[]; let row=[], field='', q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){ field+='"'; i++; } else q=false; } else field+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(field); field=''; }
    else if (c==='\n'||c==='\r'){ if (c==='\r'&&text[i+1]==='\n') i++; row.push(field); rows.push(row); row=[]; field=''; }
    else field+=c;
  }
  if (field||row.length){ row.push(field); rows.push(row); }
  const head=rows[0].map(h=>h.replace(/^﻿/,'').trim());
  return rows.slice(1).filter(r=>r[0]&&r[0].trim()).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||'').trim()])));
};

// ค่าเริ่มต้นใช้บริการฟรี Abacus (abacus.jasoncameron.dev) — เปลี่ยน COUNTER_NS ให้เป็นชื่อเฉพาะของโปรเจกต์คุณ
// หรือใส่ COUNTER_URL ของ Google Apps Script (รับ ?key=plays|signed&hit=1 ตอบ {count}) เพื่อเก็บตัวเลขในชีตของคุณเอง
const COUNTER_NS = 'fragment-of-october-6oct';
const COUNTER_URL = '';
async function counter(key, hit){
  if (COUNTER_URL){ const r=await fetch(`${COUNTER_URL}${COUNTER_URL.includes('?')?'&':'?'}key=${key}${hit?'&hit=1':''}`,{redirect:'follow'}); return (await r.json()).count; }
  const r=await fetch(`https://abacus.jasoncameron.dev/${hit?'hit':'get'}/${COUNTER_NS}/${key}`); return (await r.json()).value;
}
// แหล่งข้อมูลหลักที่แสดงในฉากจบเสมอ (แก้ได้)
const SOURCES = [
  { name:'โครงการบันทึก 6 ตุลา (doct6.com)', url:'https://doct6.com' },
  { name:'iLaw', url:'https://www.ilaw.or.th' },
  { name:'ศูนย์ทนายความเพื่อสิทธิมนุษยชน (TLHR)', url:'https://tlhr2014.com' },
  { name:'แคมเปญลบมรดก 6 ตุลา', url:CAMPAIGN_URL },
];
const mediaKind = u => { u=(u||'').split('?')[0].toLowerCase(); if(!u) return 'none';
  if(/\.(jpe?g|png|webp|gif|avif)$/.test(u)) return 'image'; if(/\.(mp3|m4a|ogg|wav|aac)$/.test(u)) return 'audio';
  if(/\.(mp4|webm|mov)$/.test(u)) return 'video'; if(/youtube\.com|youtu\.be/.test(u)) return 'youtube'; return 'page'; };
const youtubeId = u => { const m=(u||'').match(/(?:v=|youtu\.be\/|embed\/)([\w-]{6,})/); return m?m[1]:null; };
const sceneOf = f => parseInt(String(f.id).split('.')[0],10);
const minorOf = f => parseInt(String(f.id).split('.')[1]||'0',10);
const sortIds = list => [...list].sort((a,b)=>minorOf(a)-minorOf(b));
const byScene = (list,n) => sortIds(list.filter(f=>sceneOf(f)===n));
const parseLinks = s => (s||'').split(',').map(x=>x.trim().match(/^(\d+\.\d+)/)).filter(Boolean).map(m=>m[1]);
const hash = s => { let h=0; for (const c of String(s)) h=(h*31+c.charCodeAt(0))|0; return h>>>0; };
const tilt = id => ((hash(id)%7)-3)*0.6;
const isMock = f => /^\[MOCK\]/.test(f.title||'');
const looksLikeImage = u => /\.(jpe?g|png|webp|gif)(\?|$)/i.test(u||'');
const SCENE_NAME = {0:'ภูมิหลัง',1:'ก่อน 6 ตุลาฯ',2:'ช่วงเหตุการณ์ 6 ตุลาฯ',3:'คำสั่งฉบับที่ 41',4:'ปลายทางคดี',5:'ผลพวงถึงปัจจุบัน'};

/* กติกาการปรากฏ: Scene n จะโชว์เฉพาะชิ้นที่ link_to_scene ของชิ้นที่เลือกไว้ก่อนหน้า "ไปถึง"
   ถ้าชีตไม่มีลิงก์ไปถึงชิ้นใดเลย (เช่น 3.1 -> 5.x ยังว่าง) จะโชว์ทั้ง Scene เป็น fallback */
function reachable(all, fromIds, sceneN){
  const targets = new Set(fromIds.flatMap(id => { const f=all.find(x=>x.id===id); return parseLinks(f&&f.link_to_scene); }));
  const hit = byScene(all, sceneN).filter(f => targets.has(f.id));
  return { list: hit.length ? hit : byScene(all, sceneN), fallback: hit.length===0 };
}

const KIND_LABEL = { doc:'เอกสาร', file:'แฟ้มคดี', news:'หนังสือพิมพ์', tape:'เทปเสียง', film:'ม้วนฟิล์ม', photo:'ภาพถ่าย' };
function guessKind(f){
  if (f.kind && KIND_LABEL[f.kind]) return f.kind;
  const e = (f.element||'') + ' ' + (f.title||'');
  if (sceneOf(f)===5) return 'file';
  if (/เสียง|วิทยุ|เพลง|เทป/.test(e)) return 'tape';
  if (/youtube\.com|youtu\.be/.test(f.image_url||'') || /คลิป|ฟิล์ม|วิดีโอ/.test(e)) return 'film';
  if (/หนังสือพิมพ์|ดาวสยาม|โพสต์/.test(e)) return 'news';
  if (/ภาพ|โปสเตอร์|แผนที่|พิธี|ไซง่อน|ลานโพธิ์|สนาม|หอประชุม|ต้นมะขาม|ลานพระบรมรูป/.test(e)) return 'photo';
  return 'doc';
}

/* Scene 2 -> 3.1 เสมอ -> แล้วจึงถึงปลายทางคดี 4.x ที่ได้เสียงมากสุดจาก link_to_scene ของชิ้นที่เลือก (ไม่แสดงให้ผู้เล่นเห็น) */
function resolveScene2(selectedIds, all){
  const tally = {};
  selectedIds.forEach(id => { const f=all.find(x=>x.id===id); parseLinks(f&&f.link_to_scene).forEach(t=>{ tally[t]=(tally[t]||0)+1; }); });
  const top = Object.entries(tally).filter(([k])=>k.startsWith('4.')).sort((x,y)=>y[1]-x[1])[0];
  const fallback = byScene(all,4)[0];
  return { verdict: top ? top[0] : (fallback ? fallback.id : null) }; // ปลายทางคดี (แสดงหลังคำสั่ง 41)
}

/* ---------- SVG threads (final board only): bottom of source -> pin of target ---------- */
function Threads({ containerRef, links, dep }){
  const [paths,setPaths]=useState([]);
  useLayoutEffect(()=>{
    const measure=()=>{
      const c=containerRef.current; if(!c) return; const cr=c.getBoundingClientRect();
      const box=id=>{ const el=c.querySelector(`[data-frag="${CSS.escape(id)}"]`); if(!el) return null; const r=el.getBoundingClientRect(); return {cx:r.left-cr.left+r.width/2+c.scrollLeft, top:r.top-cr.top+c.scrollTop, bottom:r.bottom-cr.top+c.scrollTop}; };
      setPaths(links.map(l=>{ const a=box(l.from), b=box(l.to); if(!a||!b) return null;
        const x1=a.cx, y1=a.bottom-6, x2=b.cx, y2=b.top-4; const dy=Math.max(30,(y2-y1)*0.5);
        return { d:`M${x1},${y1} C${x1},${y1+dy} ${x2},${y2-dy} ${x2},${y2}`, cls:l.cls||'thread' }; }).filter(Boolean));
    };
    measure(); const raf=requestAnimationFrame(measure); const t=setTimeout(measure,450);
    const ro=('ResizeObserver' in window)&&containerRef.current?new ResizeObserver(measure):null; ro&&ro.observe(containerRef.current);
    window.addEventListener('resize',measure); document.fonts&&document.fonts.ready.then(measure);
    return ()=>{ window.removeEventListener('resize',measure); cancelAnimationFrame(raf); clearTimeout(t); ro&&ro.disconnect(); };
  },[JSON.stringify(links),dep]);
  return <svg className="absolute inset-0 w-full h-full pointer-events-none" style={{zIndex:1}} aria-hidden="true">{paths.map((p,i)=><path key={i} d={p.d} className={p.cls}/>)}</svg>;
}

/* ---------- card ---------- */
function Card({ f, selected, dim, onClick, action, actionLabel, actionDisabled, compact, style, className='' }){
  const kind = guessKind(f);
  return (
    <div data-frag={f.id} className={`card k-${kind} ${selected?'selected':''} ${dim?'dim':''} ${className}`} style={{transform:`rotate(${tilt(f.id)}deg)`, ...style}}>
      <div className={`pin ${dim?'grey':''}`}/>
      {kind==='news' && <div className="strip">หนังสือพิมพ์</div>}
      {kind==='tape' && <div className="strip"><span className="reel"/><span className="reel"/></div>}
      {kind==='photo' && <div className="strip overflow-hidden">{looksLikeImage(f.image_url)&&<img src={f.image_url} alt="" className="w-full h-full object-cover" style={{filter:'grayscale(.4) contrast(1.1)'}} onError={e=>{e.currentTarget.style.display='none';}}/>}</div>}
      {kind!=='news' && kind!=='tape' && kind!=='photo' && <div className="strip"/>}
      <div className="body" onClick={onClick} role={onClick?'button':undefined} tabIndex={onClick?0:undefined} onKeyDown={e=>{ if(onClick&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); onClick(); } }}>
        <div className="flex items-center gap-2 text-[10px] tracking-widest text-mute"><span>#{f.id}</span><span>·</span><span className="truncate">{f.element}</span>{isMock(f)&&<span className="text-red">MOCK</span>}</div>
        <div className={`ttl ${compact?'text-[13px]':''}`}>{f.title||f.element}</div>
        {!compact && f.date && <div className="sub">{f.date}</div>}
        {kind==='news' && !compact && <div className="cols"/>}
        {action && <button disabled={actionDisabled} onClick={e=>{e.stopPropagation(); action();}} className={`mt-3 text-[12px] font-semibold px-2.5 py-1 border ${selected?'bg-red border-red text-cream':actionDisabled?'border-mute text-mute opacity-60 cursor-not-allowed':'border-ink'}`}>{actionDisabled?'อ่านก่อนจึงเก็บได้':actionLabel}</button>}
      </div>
      {kind==='film' && <div className="strip2"/>}
      {!action && <span className="dot"/>}
    </div>
  );
}

/* ---------- detail ---------- */
function Detail({ f }){
  const [fail,setFail]=useState(false);
  useEffect(()=>setFail(false),[f&&f.id]);
  if (!f) return null;
  const url=f.image_url;
  return (
    <div className="fade-in">
      <div className="text-[11px] tracking-widest text-mute">SCENE {sceneOf(f)} · #{f.id} · {f.element}</div>
      <h3 className="text-xl font-semibold leading-snug mt-1" style={{textWrap:'balance'}}>{f.title||f.element}</h3>
      {f.date && <div className="text-sm text-gold mt-1">{f.date}</div>}
      <Media url={url} title={f.title||f.element} element={f.element} fail={fail} setFail={setFail} tape={guessKind(f)==='tape'}/>
      <p className="mt-3 text-[14px] leading-relaxed whitespace-pre-line text-cream/90">{f.sub_title || ''}</p>
    </div>
  );
}
/* ---------- RadioPlayer: คลื่นเสียงวิทยุ (ไฟล์เสียง = คลื่นจริงจาก Web Audio, YouTube = คลื่นจำลองขณะเล่น) ---------- */
let ytApiPromise=null;
function loadYT(){ if(window.YT&&window.YT.Player) return Promise.resolve(window.YT); if(ytApiPromise) return ytApiPromise;
  ytApiPromise=new Promise(res=>{ const prev=window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady=()=>{ prev&&prev(); res(window.YT); };
    const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; s.onerror=()=>res(null); document.head.appendChild(s); setTimeout(()=>res(window.YT||null),8000); });
  return ytApiPromise; }
function RadioPlayer({ url, title }){
  const kind=mediaKind(url); const cvRef=useRef(null); const audioRef=useRef(null); const ytRef=useRef(null); const holderRef=useRef(null);
  const [playing,setPlaying]=useState(false); const [cur,setCur]=useState(0); const [dur,setDur]=useState(0); const [ready,setReady]=useState(kind==='audio'); const [err,setErr]=useState('');
  const anaRef=useRef(null); const raf=useRef(0);
  // YouTube: hidden player controlled by API
  useEffect(()=>{ if(kind!=='youtube') return; let dead=false; let iv;
    loadYT().then(YT=>{ if(dead||!YT||!holderRef.current) { if(!YT) setErr('โหลดตัวเล่นไม่ได้ (ต้องเปิดบนเว็บจริง)'); return; }
      ytRef.current=new YT.Player(holderRef.current,{ videoId:youtubeId(url), height:'1', width:'1', playerVars:{controls:0,disablekb:1,rel:0,playsinline:1,origin:location.origin},
        events:{ onReady:e=>{ setReady(true); setDur(e.target.getDuration()||0); iv=setInterval(()=>{ try{ setCur(ytRef.current.getCurrentTime()||0); setDur(d=>d||ytRef.current.getDuration()||0);}catch(x){} },250); },
                 onStateChange:e=>setPlaying(e.data===1), onError:()=>setErr('เล่นคลิปนี้ไม่ได้') } }); });
    return ()=>{ dead=true; clearInterval(iv); try{ ytRef.current&&ytRef.current.destroy(); }catch(x){} }; },[url]);
  // waveform drawing
  useEffect(()=>{ const cv=cvRef.current; if(!cv) return; const ctx=cv.getContext('2d'); const W=cv.width=cv.clientWidth*2, H=cv.height=cv.clientHeight*2; const N=64; let t=0; let buf=null;
    const draw=()=>{ ctx.clearRect(0,0,W,H); ctx.fillStyle='rgba(245,245,245,.08)'; ctx.fillRect(0,H/2-1,W,2);
      if(anaRef.current){ buf=buf||new Uint8Array(anaRef.current.frequencyBinCount); anaRef.current.getByteFrequencyData(buf); }
      const bw=W/N; for(let i=0;i<N;i++){ let v; if(anaRef.current&&playing){ v=buf[Math.floor(i*buf.length/N*0.6)]/255; } else if(playing){ v=0.25+0.55*Math.abs(Math.sin(t*0.9+i*0.35)*Math.cos(t*0.37+i*0.12))*(0.6+0.4*Math.random()); } else { v=0.06+0.04*Math.sin(i*0.5); }
        const h=Math.max(2,v*H*0.9); ctx.fillStyle=i/N<(dur?cur/dur:0)?'#8B2323':'rgba(245,245,245,.55)'; ctx.fillRect(i*bw+bw*0.25,H/2-h/2,bw*0.5,h); }
      t+=0.12; raf.current=requestAnimationFrame(draw); };
    draw(); return ()=>cancelAnimationFrame(raf.current); },[playing,cur,dur]);
  const ensureAnalyser=()=>{ if(kind!=='audio'||anaRef.current) return; try{ const AC=window.AudioContext||window.webkitAudioContext; const ac=new AC(); const src=ac.createMediaElementSource(audioRef.current); const an=ac.createAnalyser(); an.fftSize=256; src.connect(an); an.connect(ac.destination); anaRef.current=an; }catch(e){} };
  const toggle=()=>{ if(kind==='audio'){ const a=audioRef.current; ensureAnalyser(); if(a.paused){ a.play().catch(()=>setErr('เล่นไฟล์ไม่ได้')); } else a.pause(); }
    else if(ytRef.current&&ready){ playing?ytRef.current.pauseVideo():ytRef.current.playVideo(); } };
  const seek=s=>{ const to=Math.max(0,Math.min(dur||0,s)); if(kind==='audio'){ audioRef.current.currentTime=to; setCur(to); } else if(ytRef.current&&ready){ ytRef.current.seekTo(to,true); setCur(to); } };
  const fmt=s=>{ s=Math.floor(s||0); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
  const Btn=({onClick,label,children,big})=><button onClick={onClick} aria-label={label} disabled={!ready&&!err} className={`flex items-center justify-center border border-cream/40 text-cream hover:border-red disabled:opacity-40 ${big?'w-12 h-12 bg-red border-red':'w-10 h-10'}`}>{children}</button>;
  return (
    <div className="mt-3 bg-black border border-line p-4 relative overflow-hidden">
      <div className="flex items-center justify-between text-[11px] tracking-widest text-mute"><span>เทปเสียง · {kind==='youtube'?'สถานีวิทยุ':'บันทึกเสียง'}</span><span className={`w-2 h-2 rounded-full ${playing?'bg-red animate-pulse':'bg-mute'}`}/></div>
      <canvas ref={cvRef} className="w-full h-16 mt-3 cursor-pointer" onClick={e=>{ const r=e.currentTarget.getBoundingClientRect(); seek(((e.clientX-r.left)/r.width)*dur); }} aria-hidden="true"/>
      <div className="flex items-center gap-3 mt-3">
        <Btn onClick={()=>seek(cur-10)} label="ย้อนกลับ 10 วินาที"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 19l-7-7 7-7M20 19l-7-7 7-7"/></svg></Btn>
        <Btn onClick={toggle} label={playing?'หยุด':'เล่น'} big>{playing?<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>:<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l14 8-14 8z"/></svg>}</Btn>
        <Btn onClick={()=>seek(cur+10)} label="ไปข้างหน้า 10 วินาที"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M13 5l7 7-7 7M4 5l7 7-7 7"/></svg></Btn>
        <div className="ml-auto text-xs text-mute tabular-nums">{fmt(cur)} / {fmt(dur)}</div>
      </div>
      {err && <div className="text-[11px] text-red mt-2">{err} — <a href={url} target="_blank" rel="noopener" className="underline">เปิดต้นฉบับ ↗</a></div>}
      {!ready && !err && <div className="text-[11px] text-mute mt-2">กำลังจูนสถานี…</div>}
      {kind==='audio' && <audio ref={audioRef} src={url} preload="metadata" crossOrigin="anonymous" onTimeUpdate={e=>setCur(e.currentTarget.currentTime)} onLoadedMetadata={e=>setDur(e.currentTarget.duration)} onPlay={()=>setPlaying(true)} onPause={()=>setPlaying(false)} onEnded={()=>setPlaying(false)} onError={()=>setErr('โหลดไฟล์เสียงไม่ได้')}/>}
      {kind==='youtube' && <div className="absolute w-px h-px opacity-0 pointer-events-none" style={{left:-9999}}><div ref={holderRef}/></div>}
    </div>
  );
}
function Media({ url, title, element, fail, setFail, tape }){
  const k=mediaKind(url);
  if (tape && (k==='audio'||k==='youtube')) return <RadioPlayer url={url} title={title}/>;
  const box='mt-3 bg-board border border-line relative overflow-hidden';
  if (k==='image' && !fail) return <div className={box+' aspect-[4/3]'}><img src={url} alt={title} className="w-full h-full object-cover" onError={()=>setFail(true)} style={{filter:/\.gif/i.test(url)?'none':'grayscale(.3) contrast(1.1)'}}/></div>;

  return (
    <div className={box+' aspect-[4/3]'}>
      <div className="absolute inset-0 flex flex-col items-center justify-center text-center p-4 text-mute text-xs">
        <div>{element}</div>

      </div>

}

/* ---------- 9:16 share image (1080x1920) ---------- */
function wrapText(ctx, text, maxW){
  const words=String(text).split(/(\s+)/); const lines=[]; let cur='';
  const push=()=>{ if(cur.trim()) lines.push(cur.trim()); cur=''; };
  for (const w of words){
    if (ctx.measureText(cur+w).width<=maxW){ cur+=w; continue; }
    push();
    if (ctx.measureText(w).width<=maxW){ cur=w; continue; }
    for (const ch of w){ if (ctx.measureText(cur+ch).width>maxW) push(); cur+=ch; }
  }
  push(); return lines;
}
function renderShareImage(groups, edges){
  const W=1080, H=1920, c=document.createElement('canvas'); c.width=W; c.height=H; const ctx=c.getContext('2d');
  const FONT='"IBM Plex Sans Thai", Sarabun, sans-serif';
  ctx.fillStyle='#000000'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#8B2323'; ctx.font=`600 26px ${FONT}`; ctx.fillText(GAME_EN.toUpperCase(), 72, 120);
  ctx.fillStyle='#F5F5F5'; ctx.font=`700 64px ${FONT}`; ctx.fillText(GAME_TH, 72, 200);
  ctx.fillStyle='#9A9A9A'; ctx.font=`400 30px ${FONT}`; ctx.fillText(GAME_SUB+' — แฟ้มคดีของฉัน', 72, 250);
  // layout pass (positions in unscaled space), then squeeze to fit
  let y=320; const cardW=290, cardH=150, gap=22, perRow=3; const pos={}; const labels=[];
  groups.forEach(g=>{
    if (!g.items.length) return;
    labels.push({y, text:`SCENE ${g.scene} · ${g.label}`}); y+=18;
    g.items.forEach((f,i)=>{ const col=i%perRow, row=Math.floor(i/perRow); pos[f.id]={x:72+col*(cardW+gap), y:y+row*(cardH+gap)}; });
    y+= Math.ceil(g.items.length/perRow)*(cardH+gap)+44;
  });
  const scale = y>H-260 ? (H-260-320)/(y-320) : 1;
  const T=v=>320+(v-320)*scale;
  labels.forEach(l=>{ ctx.fillStyle='#B8B8B8'; ctx.font=`600 22px ${FONT}`; ctx.fillText(l.text.toUpperCase(), 72, T(l.y)); });
  // edges
  ctx.lineWidth=3; ctx.lineCap='round';
  edges.forEach(e=>{ const a=pos[e.from], b=pos[e.to]; if(!a||!b) return; ctx.strokeStyle=e.cls==='thread-gold'?'#B8B8B8':'#8B2323';
    const x1=a.x+cardW/2, y1=T(a.y+cardH*scale), x2=b.x+cardW/2, y2=T(b.y); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.bezierCurveTo(x1,y1+40,x2,y2-40,x2,y2); ctx.stroke(); });
  // cards
  groups.forEach(g=>g.items.forEach(f=>{ const p=pos[f.id]; const x=p.x, yy=T(p.y), h=cardH*scale;
    ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(x+4,yy+6,cardW,h);
    ctx.fillStyle='#F5F5F5'; ctx.fillRect(x,yy,cardW,h);
    ctx.fillStyle=sceneOf(f)===5?'#000000':'#8B2323'; ctx.fillRect(x,yy,cardW,7);
    ctx.fillStyle='#8B2323'; ctx.beginPath(); ctx.arc(x+cardW/2,yy,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5C5C5C'; ctx.font=`500 18px ${FONT}`; ctx.fillText(wrapText(ctx,`#${f.id} · ${f.element}`,cardW-32)[0]||'', x+16, yy+38);
    ctx.fillStyle='#000000'; ctx.font=`600 24px ${FONT}`; const lines=wrapText(ctx,f.title||f.element,cardW-32).slice(0,2);
    lines.forEach((l,i)=>ctx.fillText(l,x+16,yy+72+i*30));
    if (f.date && h>135){ ctx.fillStyle='#5C5C5C'; ctx.font=`400 18px ${FONT}`; ctx.fillText(String(f.date).slice(0,28), x+16, yy+h-16); }
  }));
  // footer
  ctx.fillStyle='#8B2323'; ctx.fillRect(0,H-200,W,200);
  ctx.fillStyle='#F5F5F5'; ctx.font=`700 40px ${FONT}`; ctx.fillText('ร่วมลงชื่อลบมรดกรัฐประหาร', 72, H-120);
  ctx.font=`400 28px ${FONT}`; ctx.fillText(`ลบคำสั่งฉบับที่ 41 · ${CAMPAIGN_URL.replace('https://','')} · ${HASHTAG}`, 72, H-70);
  return c;
}

function useCounters(){
  const [plays,setPlays]=useState(null); const [signed,setSigned]=useState(null); const [mode,setMode]=useState('');
  useEffect(()=>{ let dead=false;
    (async()=>{
      try{ const [a,b]=await Promise.all([counter('plays',true), counter('signed',false)]); if(!dead){ setPlays(a); setSigned(b); setMode('live'); } return; }catch(e){}
      try{ const n=(parseInt(localStorage.getItem('6oct_plays')||'0',10)||0)+1; localStorage.setItem('6oct_plays',String(n)); const s=parseInt(localStorage.getItem('6oct_signed')||'0',10)||0; if(!dead){ setPlays(n); setSigned(s); setMode('local'); } }catch(e){ if(!dead) setMode('none'); }
    })(); return ()=>{ dead=true; }; },[]);
  // นับผู้กดปุ่มร่วมลงชื่อ: คนละ 1 ครั้งต่อเบราว์เซอร์ อัปเดตตัวเลขบนจอทันที แล้วส่งไปนับรวมกับทุกคน
  const sign=async()=>{ try{ if(localStorage.getItem('6oct_signed_once')) return; localStorage.setItem('6oct_signed_once','1'); }catch(e){}
    setSigned(s=>(s||0)+1);

    try{ const s=(parseInt(localStorage.getItem('6oct_signed')||'0',10)||0)+1; localStorage.setItem('6oct_signed',String(s)); }catch(e){} };
  return { plays, signed, mode, sign };
}

            <p>คำสั่งคณะปฏิรูปการปกครองแผ่นดิน ฉบับที่ 41 ออกเมื่อ 21 ตุลาคม 2519 เพียงสองสัปดาห์หลังเหตุการณ์ที่ธรรมศาสตร์ โดยคณะรัฐประหาร ไม่ผ่านสภา และแก้อัตราโทษในประมวลกฎหมายอาญาหลายมาตรา รวมถึงเพิ่มโทษมาตรา 112 จากสูงสุด 7 ปี เป็น 3–15 ปี</p>
            <p className="mt-2">ห้าสิบปีผ่านไป ผู้ก่อความรุนแรงในวันนั้นไม่มีใครถูกลงโทษ แต่อัตราโทษจากคำสั่งฉบับนั้นยังถูกใช้กับผู้ถูกดำเนินคดีอีกหลายร้อยคนจนถึงวันนี้ — รวมถึงชื่อที่คุณเพิ่งเห็นบนกระดาน</p>
            <p className="mt-2 text-cream">การลงชื่อครั้งนี้ไม่ใช่การขอยกเลิกกฎหมาย แต่ขอให้ลบคำสั่งของคณะรัฐประหารออกไป และคืนอัตราโทษให้เป็นไปตามที่สภาเคยตราไว้ — มรดกของรัฐประหารควรจบที่รุ่นเรา</p>
          </div>
          <a href={CAMPAIGN_URL} target="_blank" rel="noopener" onClick={sign} className="btn btn-red text-center"><div>ร่วมลงชื่อลบมรดกรัฐประหาร</div><div className="text-xs font-normal opacity-80">ลบคำสั่งฉบับที่ 41</div></a>
          <img src={LOGO_URL} alt="Thumb Rights · Controverter · ลบมรดกรัฐประหาร 6 ตุลา" className="w-full px-2 -mt-1" style={{maxHeight:64,objectFit:'contain'}}/>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-3"><Counter/><Refs/></div>
          <button onClick={onRestart} className="btn bg-cream text-black text-center font-semibold">เล่นอีกครั้ง</button>
        </aside>
      </div>
      {mobileDetail && sel && <Sheet title="แฟ้มหลักฐาน" onClose={()=>setMobileDetail(false)}><Detail f={sel}/><ThreadNote f={sel} all={all} to={linkedTo(sel.id)} from={linkedFrom(sel.id)} onPick={setSel}/></Sheet>}
      {shareImg && (
        <div className="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4" onClick={()=>setShareImg(null)} role="dialog" aria-modal="true">
          <div className="bg-black border border-line w-full max-w-md pop-in" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center px-4 py-2 border-b border-line">
              <span className="text-xs text-mute">ภาพสำหรับแชร์ · 9:16</span>
              <button onClick={()=>setShareImg(null)} className="text-sm text-cream/80" aria-label="ปิด">ปิด ✕</button>
            </div>
            <div className="p-4">
              <div className="flex flex-wrap items-center gap-3">
                <button onClick={saveImage} className="btn btn-red">บันทึกภาพลงเครื่อง</button>
                <span className="text-xs text-mute">{saveMsg}</span>
              </div>
              <img src={shareImg} alt="แฟ้มคดีของฉัน" className="w-full border border-line mt-3" style={{maxHeight:'58vh',objectFit:'contain'}}/>
              <p className="text-xs text-mute mt-2">โพสต์เป็นสตอรี่ Instagram พร้อม {HASHTAG} — บนมือถือกดค้างที่ภาพเพื่อบันทึกได้เช่นกัน</p>
            </div>
          </div>
        </div>)}
    </div>
  );
}
function ThreadNote({ f, all, to, from, onPick }){
  const name=id=>{ const x=all.find(y=>y.id===id); return x?(x.title||x.element):id; };
  if (!to.length && !from.length) return null;
  return (
    <div className="mt-4 border-t border-line pt-3 text-xs">
      <div className="tracking-widest text-mute mb-1">หมุดของชิ้นนี้</div>
      {to.length>0 && <div className="text-cream/80">เปิดออกมาจาก: {to.map((id,i)=><button key={id} onClick={()=>onPick(all.find(x=>x.id===id))} className="underline text-cream mr-2">{name(id)}</button>)}</div>}
      {from.length>0 && <div className="text-cream/80 mt-1">นำไปสู่: {from.map(id=><button key={id} onClick={()=>onPick(all.find(x=>x.id===id))} className="underline text-cream mr-2">{name(id)}</button>)}</div>}
    </div>
  );
}

/* ---------- App / state machine ---------- */
function normalizeRows(rows){ return rows.filter(r=>r.id&&String(r.id).trim()).map(r=>{ const o={}; for (const k of ['id','element','title','sub_title','date','image_url','link_to_scene','ref','kind']) o[k]=(r[k]||'').trim(); o.image_url=o.image_url.split(/\s+/)[0]; return o; }); }
function useSheet(){
  const [all,setAll]=useState(window.FRAGMENTS); const [status,setStatus]=useState('ข้อมูลสำรองในไฟล์'); const [loaded,setLoaded]=useState(!SHEET_CSV_URL);
  useEffect(()=>{ if(!SHEET_CSV_URL) return; let dead=false;
    const load=async()=>{ try{ const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),8000);
        const rows=await window.loadFromGoogleSheet(SHEET_CSV_URL,ctl.signal); clearTimeout(t); const norm=normalizeRows(rows);
        if(!dead&&norm.length){ setAll(norm); setStatus('ข้อมูลจากชีต · '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})); } }
      catch(e){ if(!dead) setStatus(s=>s.startsWith('ข้อมูลจากชีต')?s:'ใช้ข้อมูลสำรอง (ดึงชีตไม่ได้)'); } finally{ if(!dead) setLoaded(true); } };
    load(); const iv=setInterval(load,60000); return ()=>{ dead=true; clearInterval(iv); }; },[]);
  return { all, status, loaded };
}
function App(){
  const { all, status:sheetStatus, loaded } = useSheet();
  const [scene,setSceneRaw]=useState(0);
  const [trans,setTrans]=useState(null);
  const setScene=n=>{ const label={0:'สถานการณ์โลกก่อนเหตุการณ์ 6 ตุลาฯ',1:'หลักฐานก่อน 6 ตุลาฯ',2:'หลักฐานช่วงเหตุการณ์ 6 ตุลาฯ',3:'คำสั่งฉบับที่ 41',4:'ปลายทางของคดี',5:'ผลพวงถึงปัจจุบัน',6:'กระดานหลักฐาน'}[n]; if(label!==undefined&&n!==0){ setTrans({n:Math.floor(n),label}); } setSceneRaw(n); window.scrollTo(0,0); };
  const [pick0,setPick0]=useState(null);
  const [sel1,setSel1]=useState([]); const [sel2,setSel2]=useState([]);
  const [verdict,setVerdict]=useState(null); const [read5,setRead5]=useState([]);
  const [modal,setModal]=useState(null);
  const [readIds,setReadIds]=useState([]);
  const openFrag=f=>{ setModal(f); setReadIds(r=>r.includes(f.id)?r:[...r,f.id]); };
  const f31=all.find(f=>f.id==='3.1');
  // ชุดหลักฐานที่ "ปรากฏ" ในแต่ละฉาก อ่านจาก link_to_scene ของสิ่งที่เลือกก่อนหน้า
  const s0=byScene(all,0);
  const r1=useMemo(()=>reachable(all,pick0?[pick0]:[],1),[pick0,all]);
  const r2=useMemo(()=>reachable(all,sel1,2),[sel1,all]);
  const r5=useMemo(()=>reachable(all,['3.1'],5),[all]);
  // 6.x = ผู้ถูกดำเนินคดี (ไม่แสดงรายชิ้น) ตัดชื่อซ้ำให้เหลือคดีเดียว
  const people=useMemo(()=>{ const seen=new Set(); return byScene(all,6).filter(f=>{ const k=(f.title||f.element||f.id).trim(); if(!k||seen.has(k)) return false; seen.add(k); return true; }); },[all]);
  const goBranch=()=>{ setVerdict(resolveScene2(sel2,all)); setScene(3); };
  const f4=verdict&&all.find(f=>f.id===verdict.verdict);
  const groups=[
    {scene:0,label:SCENE_NAME[0],items:[pick0].filter(Boolean).map(id=>all.find(f=>f.id===id))},
    {scene:1,label:SCENE_NAME[1],items:sortIds(sel1).map(id=>all.find(f=>f.id===id))},
    {scene:2,label:SCENE_NAME[2],items:sortIds(sel2).map(id=>all.find(f=>f.id===id))},
    {scene:3,label:SCENE_NAME[3],items:f31?[f31]:[]},
    {scene:4,label:SCENE_NAME[4],items:f4?[f4]:[]},
    {scene:5,label:SCENE_NAME[5],items:sortIds(read5).map(id=>all.find(f=>f.id===id))},
  ].map(g=>({...g,items:g.items.filter(Boolean)}));
  const restart=()=>{ setSceneRaw(0); setPick0(null); setSel1([]); setSel2([]); setVerdict(null); setRead5([]); setReadIds([]); };
  return (
    <div className="min-h-full">
      {trans && <SceneTransition key={trans.n+trans.label} n={trans.n} label={trans.label} onDone={()=>setTrans(null)}/>}
      {scene<6 && (
        <div className="sticky z-30 bg-black/85 border-b border-line" style={{top:'env(safe-area-inset-top,0px)'}}>
          <div className="max-w-6xl mx-auto px-4 py-2 flex items-center gap-3">
            <span className="text-sm font-medium">{GAME_TH}</span>
            <div className="ml-auto flex gap-1" aria-label="ความคืบหน้า">{[0,1,2,3,4,5,6].map(n=><span key={n} className={`w-5 h-1 ${n===scene?'bg-red':n<scene?'bg-cream/50':'bg-line'}`}/>)}</div>
          </div>
        </div>)}
      {scene===0&&<Scene0 frags={s0} picked={pick0} setPicked={setPick0} onOpen={openFrag} readIds={readIds} loaded={loaded} onNext={()=>setScene(1)}/>}
      {scene===1&&<PickScene n={1} kicker="หลักฐานก่อน 6 ตุลาฯ" title="ปัจจัยสำคัญที่นำไปสู่ 6 ตุลาฯ" note="แตะอ่านแต่ละชิ้นก่อน แล้วเก็บ 1–6 ชิ้น" frags={r1.list} fallback={r1.fallback} selected={sel1} setSelected={setSel1} onOpen={openFrag} readIds={readIds} onConfirm={()=>setScene(2)}/>}
      {scene===2&&<PickScene n={2} kicker="หลักฐานช่วงเหตุการณ์ 6 ตุลาฯ" title="4–6 ตุลาคม 2519" note="แตะอ่านแต่ละชิ้นก่อน แล้วเก็บ 1–6 ชิ้น — สิ่งที่เก็บกำหนดปลายทางของคดี" frags={r2.list} fallback={r2.fallback} selected={sel2} setSelected={setSel2} onOpen={openFrag} readIds={readIds} onConfirm={goBranch}/>}
      {scene===3&&f31&&<DocScene n={3} kicker="จุดบรรจบ" title="ทุกเส้นทางมาถึงเอกสารฉบับนี้" note="อ่านให้จบก่อนไปต่อ" f={f31} onNext={()=>setScene(f4?4:4.5)} nextLabel={f4?'ดูผลลัพธ์ของคดี →':'ดูผลพวง →'}/>}
      {scene===4&&f4&&<DocScene n={4} kicker="ปลายทางของคดี" title="ผลลัพธ์ตามหลักฐานที่คุณเก็บมา" note="คดีในเส้นทางที่คุณเลือกจบลงแบบนี้" f={f4} onNext={()=>setScene(4.5)} nextLabel="ดูผลพวง →"/>}
      {scene===4.5&&<Interlude text="ผลพวงจากคำสั่งที่ 41 ไม่จบแค่นั้น แต่ยังคงส่งผลพวงตลอดมาถึงปัจจุบัน..." onDone={()=>setScene(5)}/>}
      {scene===5&&<Scene5 frags={r5.list} fallback={r5.fallback} people={people} onOpen={setModal} readIds={read5} markRead={id=>setRead5(r=>r.includes(id)?r:[...r,id])} onNext={()=>setScene(6)}/>}
      {scene===6&&<Board groups={groups} all={all} onRestart={restart} sheetStatus={sheetStatus}/>}
      {modal && <Sheet title="แฟ้มหลักฐาน" onClose={()=>setModal(null)}><Detail f={modal}/></Sheet>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
